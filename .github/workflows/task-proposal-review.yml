name: Task Proposal Review

on:
  discussion:
    types: [created]
  discussion_comment:
    types: [created]

permissions:
  discussions: write
  contents: read

jobs:
  review:
    if: >-
      github.event.discussion.category.name == 'Task Proposals' &&
      (github.event_name == 'discussion' ||
       (github.event_name == 'discussion_comment' &&
        (contains(github.event.comment.body, '/re-review') || contains(github.event.comment.body, 'retrigger bot review'))))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Write proposal to file
        env:
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          DISCUSSION_BODY: ${{ github.event.discussion.body }}
        run: |
          printf '# %s\n\n%s\n' "$DISCUSSION_TITLE" "$DISCUSSION_BODY" > proposal.md

      - name: Run rubric review
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          MODEL="models/gemini-3-flash-preview"

          if ! uv run ci_checks/rubric_review.py --model "$MODEL" proposal.md > result.json 2> review.log; then
            echo "::error::Rubric review script failed. See review.log for details."
            cat review.log
            exit 1
          fi

          DECISION=$(python3 -c "import json; print(json.load(open('result.json'))['decision'] or 'Unknown')")
          REVIEW=$(python3 -c "import json; print(json.load(open('result.json'))['review'] or 'No review generated')")

          echo "decision=$DECISION" >> $GITHUB_OUTPUT

          # Write review to file to avoid shell escaping issues
          echo "$REVIEW" > review_text.md

      - name: Format and post comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCUSSION_ID: ${{ github.event.discussion.node_id }}
        run: |
          DECISION="${{ steps.review.outputs.decision }}"

          # Decision badge
          case "$DECISION" in
            "Strong Accept") BADGE="🟢 **Strong Accept**" ;;
            "Accept")        BADGE="🟢 **Accept**" ;;
            "Uncertain")     BADGE="🟡 **Uncertain**" ;;
            "Reject")        BADGE="🔴 **Reject**" ;;
            "Strong Reject") BADGE="🔴 **Strong Reject**" ;;
            *)               BADGE="⚪ **$DECISION**" ;;
          esac

          REVIEW=$(cat review_text.md)
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          RUBRIC_URL="${REPO_URL}/blob/main/rubrics/task-proposal-rubric.md"

          # Build comment body
          BODY=$(cat << COMMENT_EOF
          ## 📋 Task Proposal Rubric Review

          **Recommendation:** $BADGE

          <details>
          <summary>Full Review</summary>

          $REVIEW

          </details>

          > 🤖 This is an automated recommendation for a human maintainer — not a final decision. Based on [rubrics/task-proposal-rubric.md](${RUBRIC_URL}).
          COMMENT_EOF
          )

          # Post comment via GraphQL
          gh api graphql \
            -f query='mutation($discussionId: ID!, $body: String!) {
              addDiscussionComment(input: {
                discussionId: $discussionId
                body: $body
              }) {
                comment {
                  id
                  url
                }
              }
            }' \
            -f discussionId="$DISCUSSION_ID" \
            -f body="$BODY"